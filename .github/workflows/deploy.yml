name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Wyliczenia muszą przechodzić testy, zanim trafią na stronę.
      - run: npm test

      # Build używa ścieżek względnych (base: './') i HashRouter,
      # więc działa w podkatalogu /postoj/ bez BASE_PATH ani 404.html.
      # Adres bazy i klucz publiczny z Settings -> Secrets and variables ->
      # Actions -> Variables. Bez nich aplikacja buduje się w trybie lokalnym.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      # Pages musi być włączone w ustawieniach repozytorium
      # (Settings -> Pages -> Source: GitHub Actions).
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
